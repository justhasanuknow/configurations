# Entry point. Machine-specific settings (monitors, scale, VM quirks)
# live in local.conf, which is not tracked by git.

# --- Programs ----------------------------------------------------------------
$terminal = kitty
$launcher = wofi --show drun

source = ~/.config/hypr/local.conf
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/rules.conf

# --- Autostart ---------------------------------------------------------------
# (waybar, wallpaper etc. will be added as they are set up)

# --- Input -------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# --- Look --------------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 6
}

animations {
    enabled = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
}
