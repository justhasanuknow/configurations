# Lock screen: blurred screenshot of the session, clock, date, password field. Rose-pine.

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
}

label {
    monitor =
    text = $TIME
    color = rgb(e0def4)
    font_size = 72
    font_family = $font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(908caa)
    font_size = 18
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 48
    outline_thickness = 2
    rounding = 6
    inner_color = rgb(1f1d2e)
    outer_color = rgb(c4a7e7)
    check_color = rgb(f6c177)
    fail_color = rgb(eb6f92)
    font_color = rgb(e0def4)
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
