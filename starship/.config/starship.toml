# Single-line prompt: directory, git, then the input on the same line
add_newline = false
format = "$directory$git_branch$git_status$character"

[directory]
truncation_length = 3
style = "bold blue"

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "red"
format = "[$all_status$ahead_behind]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
