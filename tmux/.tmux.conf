#Prefix: Ctrl+b -> Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload Config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Remove Escape delay
set -sg escape-time 10

# True color (for neovim colors)
# terminal-features matches every outer terminal, including kitty's xterm-kitty
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Copy to the system clipboard through the terminal (OSC 52); kitty supports it
set -s set-clipboard on

# Mouse support
set -g mouse on

# Window pane numbers should start from 1 not 0
set -g base-index 1
setw -g pane-base-index 1

# Restart numbers when window closes
set -g renumber-windows on

# Neovim <-> tmux: Ctrl-h/j/k/l
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Copy Mode Vi Keys
setw -g mode-keys vi

# Make selection be like Vim: Start with v and copy with y
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Fuzzy project switcher
bind f display-popup -E "$HOME/.local/bin/tmux-sessionizer"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'rose-pine/tmux'

# Match the Neovim variant (main, moon or dawn)
set -g @rose_pine_variant 'main'
set -g @rose_pine_host 'on'
set -g @rose_pine_date_time '%H:%M'
set -g @rose_pine_directory 'on'

# Restore pane contents too, not just the layout
set -g @resurrect-capture-pane-contents 'on'

# Save every 15 minutes and restore the last save when tmux starts
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ---EOF---
run '~/.tmux/plugins/tpm/tpm'
